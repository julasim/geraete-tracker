# Geräte-Tracker auf dem Mini-PC.
#
# Drei Dienste: der Eingang (Caddy), die Anwendung und ihre Datenbank.
#
# Nach außen offen ist NUR Caddy (80/443). Die Anwendung horcht auf
# 127.0.0.1, die Datenbank auf gar nichts — sie hat bewusst kein "ports:".
# Stünde dort eines, wäre Postgres im ganzen Büro-WLAN erreichbar.
#
#   docker compose up -d --build     starten
#   docker compose logs -f app       zusehen
#   docker compose down              anhalten (Daten bleiben)
#
# Caddy holt das HTTPS-Zertifikat selbst. Das entscheidet darüber, ob der
# Barcode-Scanner funktioniert: Ohne gültiges Zertifikat gibt der Browser
# die Kamera nicht frei.

services:
  app:
    build: .
    image: geraete-tracker:neueste
    container_name: tracker-app
    restart: unless-stopped
    # Protokolle begrenzen: 3 Dateien à 10 MB, dann wird die älteste
    # überschrieben. Ohne diese Angabe wachsen sie unbegrenzt — auf einem
    # Mini-PC, der jahrelang durchläuft, ist das der Ausfall, der nach zwei
    # Jahren kommt und den niemand kommen sieht.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      API_PORT: 3000
      # Wird hier zusammengesetzt, damit das Passwort nur an einer Stelle steht.
      DATABASE_URL: postgres://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:?In der .env fehlt POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tracker}
      DB_AUTO_MIGRATE: "true"
      # Fehlt eines der beiden Geheimnisse, bricht compose sofort mit dieser
      # Meldung ab — besser als ein Container, der in einer Neustartschleife hängt.
      JWT_SECRET: ${JWT_SECRET:?In der .env fehlt JWT_SECRET (mindestens 32 Zeichen)}
      # Caddy liefert echtes HTTPS — ohne diese Zeile käme kein Cookie an.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_TAGE: ${SESSION_TAGE:-30}
      PASSWORT_MIN_LAENGE: ${PASSWORT_MIN_LAENGE:-12}
      LEAK_PRUEFUNG: ${LEAK_PRUEFUNG:-true}
      SPERRE_NACH_VERSUCHEN: ${SPERRE_NACH_VERSUCHEN:-10}
      SPERRE_MINUTEN: ${SPERRE_MINUTEN:-15}
      FIRMENNAME: ${FIRMENNAME:-}
      ETIKETT_FORMAT: ${ETIKETT_FORMAT:-70x37}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Fotos und Anhänge überleben jedes Neubauen des Abbilds.
      - fotos:/data
    ports:
      # Nur auf dem Mini-PC selbst, für Fehlersuche und die Prüfläufe.
      # Von außen kommt man ausschließlich über Caddy herein.
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: tracker-postgres
    restart: unless-stopped
    # Protokolle begrenzen: 3 Dateien à 10 MB, dann wird die älteste
    # überschrieben. Ohne diese Angabe wachsen sie unbegrenzt — auf einem
    # Mini-PC, der jahrelang durchläuft, ist das der Ausfall, der nach zwei
    # Jahren kommt und den niemand kommen sieht.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?In der .env fehlt POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
    volumes:
      - datenbank:/var/lib/postgresql/data
    healthcheck:
      # Ohne diese Prüfung startet die App gegen eine Datenbank, die noch
      # hochfährt, und stirbt beim ersten Migrationslauf.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracker} -d ${POSTGRES_DB:-tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # KEIN ports: — die Datenbank bleibt im internen Netz.

  # Der Eingang: TLS und Weiterleitung an die Anwendung.
  #
  # Nur dieser Dienst ist von außen erreichbar. Er holt und erneuert das
  # Zertifikat automatisch — bei einer öffentlichen Domain von Let's Encrypt,
  # im reinen Büro-Netz stellt er selbst eines aus.
  caddy:
    image: caddy:2-alpine
    container_name: tracker-caddy
    restart: unless-stopped
    # Protokolle begrenzen: 3 Dateien à 10 MB, dann wird die älteste
    # überschrieben. Ohne diese Angabe wachsen sie unbegrenzt — auf einem
    # Mini-PC, der jahrelang durchläuft, ist das der Ausfall, der nach zwei
    # Jahren kommt und den niemand kommen sieht.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DOMAIN: ${DOMAIN:?In der .env fehlt DOMAIN (z. B. geraete.meinefirma.at oder tracker.local)}
      # Ergibt "email julius@..." wenn ACME_EMAIL gesetzt ist, sonst nichts.
      # Eine leere email-Zeile im Caddyfile verhindert den Start.
      ACME_ZEILE: ${ACME_EMAIL:+email ${ACME_EMAIL}}
      # Leer = Let's Encrypt. "tls internal" = Caddy stellt selbst aus,
      # für den Betrieb ohne öffentliche Adresse.
      TLS_MODUS: ${TLS_MODUS:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Die Zertifikate überleben jeden Neustart. Ohne dieses Volume würde
      # bei jedem "up" ein neues geholt — Let's Encrypt begrenzt das auf
      # fünf pro Woche und Domain, danach steht die Anlage.
      - caddy_daten:/data
      - caddy_konfig:/config
    depends_on:
      - app

volumes:
  datenbank:
  fotos:
  caddy_daten:
  caddy_konfig:
